<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>九宫格首页</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f6f7fb;
      }

      .grid {
        width: min(90vw, 460px);
        aspect-ratio: 1 / 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 12px;
      }

      .cell {
        border: 1px solid #dfe3eb;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cell-link {
        color: #1e40af;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
      }

      .cell-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="grid">
      <div class="cell">
        <a class="cell-link" href="./dist/index.html">打卡记录</a>
      </div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </main>
  </body>
</html>
